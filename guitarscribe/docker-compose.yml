services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_SEPARATION: ${GUITARSCRIBE_INSTALL_SEPARATION:-false}
        INSTALL_YOUTUBE: ${GUITARSCRIBE_INSTALL_YOUTUBE:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./fixtures:/app/fixtures:ro
      - ./output:/app/output
      - ./rhythm-patterns:/app/rhythm-patterns:ro
    env_file:
      - .env
    environment:
      - GUITARSCRIBE_WORK_DIR=/app/output/work
      - GUITARSCRIBE_MELODY_SEPARATOR=${GUITARSCRIBE_MELODY_SEPARATOR:-off}
      - GUITARSCRIBE_YOUTUBE_ENABLED=${GUITARSCRIBE_YOUTUBE_ENABLED:-false}
      - PYTHONUNBUFFERED=1
    command: python -m app.cli serve --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
