<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>伴奏拍長 · 另一來源對照</title>
<style>body{font:18px/1.7 system-ui;max-width:700px;margin:35px auto;padding:0 20px;color:#243246;background:#f7f8fb}section{background:#fff;padding:18px;margin:18px 0;border-radius:12px}audio{width:100%}#error{color:#a21b26}</style>
<h1>伴奏拍長：另一來源</h1>
<p>這是先前聽過的《情非得已》現場來源。同一段原曲、和弦與刷奏方式，只比較伴奏拍長整理。這次不用找工作區，也不用拿吉他。</p>
<section><h2>A · 原曲＋系統吉他</h2><audio controls preload="metadata" src="A.wav"></audio></section>
<section><h2>B · 原曲＋系統吉他</h2><audio controls preload="metadata" src="B.wav"></audio></section>
<p>各聽一次，回覆：<strong>A 較自然合拍／B 較自然合拍／差不多／都不對</strong>。若有特別明顯的位置，再補秒數即可。</p>
<p>每段 30 秒，後面約 18–28 秒較值得留意。若吉他聽不清楚或差異聽不出來，直接告訴我，不用勉強判斷。</p>
<p id="error" role="alert"></p>
<script>const players=[...document.querySelectorAll('audio')];for(const player of players){player.addEventListener('play',()=>players.forEach(p=>{if(p!==player)p.pause();}));player.addEventListener('error',()=>document.querySelector('#error').textContent='音檔載入失敗，請回報。');}</script></html>
