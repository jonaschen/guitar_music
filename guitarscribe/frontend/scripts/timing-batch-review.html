<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GuitarScribe · 集中試聽</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#17212d;font:16px/1.65 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:32px 16px}h1{font-size:28px;margin:0 0 16px}h2{font-size:21px;margin:0 0 8px}p{margin:8px 0 16px}section{border-top:1px solid #d3d9df;padding:24px 0}small,.muted{color:#526071}button,select,textarea{font:inherit;max-width:100%;border:1px solid #b9c2cc;border-radius:6px;background:white;color:inherit;padding:8px 12px}button{cursor:pointer;min-height:44px}button[aria-pressed=true],#copy{background:#146a68;color:white;border-color:#146a68}nav{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}audio{width:100%;margin:8px 0}label{display:block;margin:12px 0}select{display:block;width:100%;margin-top:4px}textarea{width:100%;min-height:100px}a{color:#146a68}#status{min-height:26px}details{margin:12px 0}summary{cursor:pointer}
</style><main><h1>這次只聽三組</h1><p>每組 40 秒。先聽 B；有疑問再切 A，會保留播放位置。不必重新分析歌曲，也不用測操作。</p><p class="muted">前兩組只判斷答答聲是否能跟拍；第三組只比較刷奏。這些都是候選，原分析與修改仍保留。</p><div id="groups"></div><label>補充（可不填）<textarea id="notes" placeholder="例如：第 1 組 B 在播放器 20 秒後變快"></textarea></label><button id="copy">複製回報</button><p id="status" role="status"></p><textarea id="report" aria-label="可複製的回報" hidden readonly></textarea><p><a href="/">回到歌曲首頁</a></p></main>
<script type="module">
const rows=await fetch('packet.json').then(r=>{if(!r.ok)throw Error('試聽資料載入失敗');return r.json()});
const players=[];const answers=[];
function select(section,label,options,key){const l=document.createElement('label');l.textContent=label;const s=document.createElement('select');s.setAttribute('aria-label',label);for(const text of ['尚未回答',...options])s.add(new Option(text,text));l.append(s);section.append(l);answers.push({key,input:s});s.addEventListener('change',save);return s;}
function save(){try{localStorage.setItem('timing-batch-2026-11-04',JSON.stringify({answers:answers.map(a=>a.input.value),notes:document.querySelector('#notes').value}));}catch{}}
for(const row of rows){const sec=document.createElement('section');sec.dataset.number=row.number;const h=document.createElement('h2');h.textContent=`${row.number}. ${row.title}`;sec.append(h);const p=document.createElement('p');p.textContent=row.kind==='click'?`原曲 ${row.start}–${row.end} 秒。A：舊拍點候選；B：新拍點候選。較高的答答聲代表系統判定的第一拍。`:'沿用已接受的拍點與同一份和弦。A：每小節一下；B：每拍一下，第一拍較重。';sec.append(p);
const nav=document.createElement('nav');nav.setAttribute('aria-label',`${row.number} 聲音版本`);sec.append(nav);const audio=document.createElement('audio');audio.controls=true;audio.preload='metadata';audio.src=`${row.number}-b-mix.wav`;players.push(audio);audio.addEventListener('play',()=>players.forEach(p=>{if(p!==audio)p.pause()}));audio.addEventListener('error',()=>{msg.textContent='聲音載入失敗，請重新整理後重試。'});const buttons=[];
const variants=[['B','b-mix'],['A','a-mix'],['原曲','source']];if(row.kind==='strum')variants.push(['B 吉他獨聽','b-guitar']);
for(const [label,file] of variants){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(label==='B'));b.addEventListener('click',async()=>{const time=audio.currentTime,playing=!audio.paused;audio.pause();buttons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));audio.src=`${row.number}-${file}.wav`;audio.currentTime=time;msg.textContent='';if(playing)try{await audio.play()}catch(error){if(error.name!=='AbortError')msg.textContent='請按播放器的播放鍵繼續。'}});buttons.push(b);nav.append(b);}sec.append(audio);const msg=document.createElement('p');msg.setAttribute('role','status');sec.append(msg);
if(row.kind==='click'){
select(sec,'B 的答答聲能跟拍嗎？',['能跟拍','有偏移／不穩','無法判斷'],`${row.number} 跟拍`);
select(sec,'B 的速度密度聽起來如何？',['正常','快一倍','慢一半','無法判斷'],`${row.number} 密度`);
select(sec,'B 較高的重音像第一拍嗎？',['像第一拍','位置不對','無法判斷'],`${row.number} 第一拍`);
}else select(sec,'哪一種較適合跟彈？',['B 每拍一下','A 每小節一下','都可以','都不好','無法判斷'],`${row.number} 刷奏`);
if(row.revision){const d=document.createElement('details');const sum=document.createElement('summary');sum.textContent='想順便看完整試驗譜';d.append(sum);const a=document.createElement('a');a.href=`/?revision=${encodeURIComponent(row.revision)}`;a.target='_blank';a.rel='noopener';a.textContent='開啟獨立試驗稿';d.append(a);const hint=document.createElement('p');hint.textContent='拍格尚待確認；和弦名稱、切換時間仍是原分析，本次不要求驗收整首。';d.append(hint);sec.append(d);}
document.querySelector('#groups').append(sec);}
try{const old=JSON.parse(localStorage.getItem('timing-batch-2026-11-04'));if(old){answers.forEach((a,i)=>{if([...a.input.options].some(o=>o.value===old.answers?.[i]))a.input.value=old.answers[i]});document.querySelector('#notes').value=old.notes??'';}}catch{}
document.querySelector('#notes').addEventListener('input',save);
document.querySelector('#copy').addEventListener('click',async()=>{const text=answers.map(a=>`${a.key}：${a.input.value}`).join('\n')+'\n補充：'+document.querySelector('#notes').value;const out=document.querySelector('#report');out.value=text;out.hidden=false;try{await navigator.clipboard.writeText(text);document.querySelector('#status').textContent='已複製，貼回對話即可。';}catch{out.focus();out.select();document.querySelector('#status').textContent='請複製下方文字，貼回對話即可。';}});
</script></html>
