<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>保留換和弦入口，加入連續刷奏</title>
<style>body{font:18px/1.7 system-ui;max-width:700px;margin:35px auto;padding:0 20px;color:#243246;background:#f7f8fb}section{background:white;padding:18px;margin:18px 0;border-radius:12px}audio{width:100%}#error{color:#a21b26}</style>
<h1>加回刷奏後，還自然嗎？</h1>
<p>各 20 秒，不需要拿吉他。兩版的和弦、換和弦時的第一下與音量設定相同。</p>
<section><h2>A · 換和弦只彈一下</h2><p>上一輪你覺得有改善的 B，原音檔。</p><audio controls preload="metadata" src="A.wav"></audio></section>
<section><h2>B · 保留相同入口，加回連續刷奏</h2><audio controls preload="metadata" src="B.wav"></audio></section>
<p>各聽一次，回覆：<strong>B 仍自然／A 較自然，B 又變亂／兩個都不對／差異聽不清楚</strong>。</p>
<p>不用找精確秒數。若有「晚一拍換和弦」的感覺，也可以直接補一句。</p>
<p id="error" role="alert"></p>
<script>const players=[...document.querySelectorAll('audio')];for(const player of players){player.addEventListener('play',()=>players.forEach(p=>{if(p!==player)p.pause();}));player.addEventListener('error',()=>document.querySelector('#error').textContent='音檔載入失敗，請回報。');}</script></html>
