<h1>兩首新歌：先確認拍點</h1><p>每首 45 秒，沿用你提供的來源。答答聲只有等強度拍點，沒有小節重音，也沒有加入和弦。</p>
<p>每首只需回覆：<strong>答答聲能否讓你跟著打拍或刷奏？</strong> 若不行，是局部偏掉、逐漸偏掉，還是像快一倍／慢一半？無法判斷也可以。</p>
<section><h2>第 1 首</h2><p class="note">你先提供的 S8RWhc_LmMc，原曲 0–45 秒。</p><label>播放內容 <select data-song="1"><option value="click">原曲＋答答聲</option><option value="source">只聽原曲</option></select></label><audio id="song-1" controls preload="metadata" src="song-1-click.wav"></audio></section>
<section><h2>第 2 首</h2><p class="note">後來提供的 WObbdwgB41c，原曲 0–45 秒。</p><label>播放內容 <select data-song="2"><option value="click">原曲＋答答聲</option><option value="source">只聽原曲</option></select></label><audio id="song-2" controls preload="metadata" src="song-2-click.wav"></audio></section>
<p class="note">切換播放內容會暫停並從頭開始。兩首使用相同答答音色與音量規則；未調整任何拍點。這一步不判斷和弦品質。</p>

</main><script>
const audio=[...document.querySelectorAll('audio')];
for(const el of audio)el.addEventListener('play',()=>{for(const other of audio)if(other!==el)other.pause()});
