<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>哪一段比較合拍？</title>
<style>body{font:18px/1.6 system-ui,sans-serif;max-width:700px;margin:40px auto;padding:0 20px;background:#f6f5ef;color:#252d32}h1{font-size:27px}section{background:white;border:1px solid #d5d8d0;border-radius:12px;padding:20px;margin:16px 0}button{font:inherit;border:0;border-radius:8px;background:#245d50;color:white;padding:12px 20px;cursor:pointer;margin:4px}audio{width:100%}.note{font-size:15px;color:#53605b}</style>
<h1>哪一段比較合拍？</h1>
<p>只聽剛才出問題附近的同一段原曲。A、B、C 各約 5 秒，只比較兩個換和弦的位置。</p>
<section><button id="all">依序播放 A → B → C</button><button id="stop">停止</button><p id="status" role="status">準備完成</p><div><button data-mode="A">重聽 A</button><button data-mode="B">重聽 B</button><button data-mode="C">重聽 C</button></div><audio controls preload="metadata"></audio></section>
<p>只需回報：<strong>A／B／C 比較合拍、三段都不對，或分不出來</strong>。不需要判斷是太早還是太慢。</p>
<p class="note">總共約 18 秒。這是定位用的時間比較，沒有改動 G 旋律或保存譜；比較結果不代表和弦名稱已正確。</p>
<script>
const audio=document.querySelector('audio'),status=document.querySelector('#status');let queue=[],timer,token=0,current;
function stop(){token++;clearTimeout(timer);queue=[];audio.pause();status.textContent='已停止';}
async function play(mode){const run=token;current=mode;audio.src=`${mode}.wav`;try{await audio.play();}catch{if(run===token){stop();status.textContent='播放失敗，請重新整理後再試。';}}}
document.querySelector('#all').onclick=()=>{stop();queue=['B','C'];play('A');};
document.querySelector('#stop').onclick=stop;
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{stop();play(button.dataset.mode);});
audio.onplay=()=>status.textContent=`播放 ${current}`;
audio.onpause=()=>{if(!audio.ended){queue=[];status.textContent=`已暫停 ${current??''}`;}};
audio.onended=()=>{const next=queue.shift();if(next){status.textContent=`下一段 ${next}`;timer=setTimeout(()=>play(next),800);}else status.textContent='播放完成';};
audio.onerror=()=>{stop();status.textContent='音檔載入失敗，請重新整理後再試。';};
window.addEventListener('pagehide',stop);
</script></html>
