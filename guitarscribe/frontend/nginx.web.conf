upstream guitarscribe_backend {
    zone guitarscribe_backend 64k;
    # Docker can assign a new address when the backend container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    auth_basic "GuitarScribe friends";
    auth_basic_user_file /etc/nginx/auth/friends.htpasswd;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /backend/ {
        proxy_pass http://guitarscribe_backend/;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
