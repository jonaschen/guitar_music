name: GuitarScribe CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cloud-gateway:
    name: Private cloud gateway and backup tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: guitarscribe/infra/on_demand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated gateway dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Test authentication, usage accounting, streaming and backup
        run: python -m pytest -q -o asyncio_default_fixture_loop_scope=function

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: guitarscribe
    steps:
      - uses: actions/checkout@v4
      - name: Build backend test image
        run: docker build --tag guitarscribe-backend-ci ./backend
      - name: Run backend test suite
        run: >-
          docker run --rm
          -v "$PWD/docs:/docs:ro"
          -v "$PWD/infra:/infra:ro"
          -v "$PWD/rhythm-patterns:/rhythm-patterns:ro"
          -e GUITARSCRIBE_RHYTHM_PATTERNS_DIR=/rhythm-patterns
          guitarscribe-backend-ci pytest -q

  frontend:
    name: Frontend build and E2E
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: guitarscribe/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: guitarscribe/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated browser API dependencies
        run: python -m pip install -e '../backend[dev,quality]'
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit
      - name: Run frontend E2E suite
        run: npx playwright test --config playwright.ci.config.ts --reporter=line
      - name: Check WebKit touch and practice workflows
        run: npx playwright test --config playwright.webkit.config.ts --reporter=line
      - name: Check learning notes and reference playback in WebKit
        working-directory: guitarscribe/frontend
        env:
          GUITARSCRIBE_TEST_BROWSER: webkit
        run: npx playwright test --config playwright.learning.config.ts
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            guitarscribe/frontend/test-results
            guitarscribe/output/webkit-test-results
          retention-days: 7
